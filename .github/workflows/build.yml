name: CI/CD

on:
  push:
    branches: [sso-release-tests]

jobs:
  init:
    uses: ./.github/workflows/init.yml

  build:
    runs-on: ubuntu-latest
    needs: init
    env:
        ENVIRONMENT: ${{ needs.init.outputs.environment }}
    steps:
      - name: test
        run: echo "Current environment is $ENVIRONMENT"
